name: Deploy MAGNUS to Telegram Serverless

on:
  workflow_dispatch:
  push:
    branches:
      - magnus-source-upload
    paths:
      - "src/**"
      - "tgcloud/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "tgcloud.jsonc"
      - ".github/workflows/deploy-telegram.yml"

permissions:
  contents: read

concurrency:
  group: magnus-telegram-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy]')
    name: Build, publish and migrate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: magnus-source-upload

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Telegram Serverless credential
        shell: bash
        run: |
          if [ -z "$TGCLOUD_TOKEN" ]; then
            echo "::error::Add the TGCLOUD_TOKEN repository secret in GitHub Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Build Mini App
        run: npm run build

      - name: Validate backend JavaScript syntax
        run: |
          find tgcloud -name '*.js' -type f -print0 | xargs -0 -n1 node --check

      - name: Compile changed payment and message modules in Telegram runtime
        run: |
          npx tgcloud run handlers/message "{ from: {}, text: 'compile-check' }" --ctx '{}'
          npx tgcloud run endpoints/tutor '{}' --ctx '{}'
          npx tgcloud run endpoints/studentData '{}' --ctx '{}'

      - name: Sync deployed Telegram revision
        run: npx tgcloud fetch

      - name: Publish project modules and Mini App without deleting other cloud modules
        run: npx tgcloud push tgcloud/ dist/

      - name: Apply safe database migrations
        run: npx tgcloud migrate --safe

name: Deploy MAGNUS to Telegram Serverless

on:
  push:
    branches:
      - magnus-source-upload
    paths:
      - "src/**"
      - "tgcloud/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "tgcloud.jsonc"
      - ".github/workflows/deploy-telegram.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: magnus-telegram-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, publish and migrate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: magnus-source-upload

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Telegram Serverless credential
        shell: bash
        run: |
          if [ -z "$TGCLOUD_TOKEN" ]; then
            echo "::error::Add the TGCLOUD_TOKEN repository secret in GitHub Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Build Mini App
        run: npm run build

      - name: Publish to Telegram Serverless
        run: npx tgcloud push

      - name: Apply safe database migrations
        run: npx tgcloud migrate --safe
